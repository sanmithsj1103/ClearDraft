<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background circle with the warm off-white -->
  <circle cx="256" cy="256" r="240" fill="#FAF9F6" stroke="#E5E5E0" stroke-width="8"/>
  
  <!-- Sleek brand theme accent background for the inner emblem -->
  <circle cx="256" cy="256" r="140" fill="#D97706" fill-opacity="0.08"/>
  
  <!-- Outer concentric ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#E5E5E0" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Transcription Wave / Drafting Line Graphic -->
  <g transform="translate(156, 176)">
    <!-- Document lines / waves -->
    <path d="M 40 20 H 160" stroke="#111111" stroke-width="12" stroke-linecap="round"/>
    <path d="M 40 55 H 160" stroke="#111111" stroke-width="12" stroke-linecap="round"/>
    <path d="M 40 90 H 120" stroke="#111111" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Microphone Emblem integrated on left -->
    <rect x="0" y="10" width="24" height="60" rx="12" fill="#D97706" stroke="#111111" stroke-width="8"/>
    <path d="M -10 40 C -10 65 34 65 34 40" fill="none" stroke="#111111" stroke-width="8" stroke-linecap="round"/>
    <line x1="12" y1="62" x2="12" y2="85" stroke="#111111" stroke-width="8" stroke-linecap="round"/>
    <line x1="-2" y1="85" x2="26" y2="85" stroke="#111111" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Drafting Pencil/Pen Tip drawing the line -->
    <path d="M 120 90 L 150 60 L 160 70 L 130 100 Z" fill="#D97706" stroke="#111111" stroke-width="4"/>
    <polygon points="120,90 123,98 130,100" fill="#111111"/>
  </g>
  
  <!-- Minimal branding text clear and legible -->
  <text x="256" y="380" font-family="'Outfit', 'Inter', sans-serif" font-size="28" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="4">CLEARDRAFT</text>
</svg>
